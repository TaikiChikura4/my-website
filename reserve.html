<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約 | 地藏 大起 公式HP</title>
    <style>
        /* --- 基本設定（共通） --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #e5e5e5;
            overflow: auto; 
        }

        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- ヘッダー関連 --- */
        header {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background-color: #e5e5e5; 
            padding: 15px 30px; 
            box-sizing: border-box; 
            z-index: 100;
        }

        .title {
            margin: 0;
            font-size: 24px;
            color: #333;
            font-family: "Times New Roman", "ヒラギノ明朝 ProN W6", "Hiragino Mincho ProN", "游明朝", "Yu Mincho", "YuMincho", "MS PMincho", serif;
            letter-spacing: 2px;
            line-height: 1.4;
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
        }

        .hamburger {
            font-size: 32px;
            color: #333;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex; 
            align-items: center;  
            gap: 8px;             
            opacity: 0;
            transition: opacity 0.8s ease;
            user-select: none;
        }

        .hamburger.show {
            opacity: 1;
        }

        .hamburger-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* --- ナビゲーションメニュー --- */
        .menu {
            position: absolute;
            top: 100px;
            left: 30px;
            background-color: #ffffff; 
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 999; 
        }

        .menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu ul li {
            margin-bottom: 15px;
        }

        .menu ul li:last-child {
            margin-bottom: 0;
        }

        .menu ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.2s;
        }

        .menu ul li a:hover {
            color: #007BFF;
        }

        /* --- コンテンツ用のスタイル --- */
        .content-container {
            max-width: 800px;
            width: 85%;
            margin: 150px auto 50px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
        }

        .content-container h2 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #333;
            margin-bottom: 30px;
        }

        /* --- ▼ 予約フォーム特有のスタイル ▼ --- */
        .form-group {
            display: flex;
            margin-bottom: 25px;
            align-items: flex-start;
        }

        .form-label {
            flex: 0 0 35%;
            font-weight: bold;
            color: #333;
            padding-top: 10px;
            padding-right: 15px;
            box-sizing: border-box;
        }

        .form-input {
            flex: 1;
        }

        .form-input input[type="text"],
        .form-input input[type="number"],
        .form-input input[type="email"],
        .form-input select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #fff;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }

        .form-submit {
            text-align: center;
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .form-submit button {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-submit button:hover:not(:disabled) {
            background-color: #555;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .form-submit button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 確認画面用のスタイル */
        .confirm-item {
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .confirm-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .confirm-value {
            color: #333;
            white-space: pre-wrap;
        }
        
        #confirmScreen {
            display: none;
        }
        
        /* 予約完了画面用のスタイル */
        #completeScreen {
            display: none;
            text-align: center;
        }
        #completeScreen h2 {
            border-bottom: none;
            color: #333;
            margin-bottom: 20px;
        }
        #completeScreen p {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* スマホ向けレスポンシブデザイン */
        @media (max-width: 768px) {
            .form-group {
                flex-direction: column;
            }
            .form-label {
                flex: none;
                width: 100%;
                margin-bottom: 8px;
                padding-top: 0;
            }
            .content-container {
                padding: 25px;
            }
            .form-submit {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">地藏 大起（チクラ タイキ）<br>株式会社シーグリーン所属</h1>
        <div class="hamburger" id="hamburger">≡<span class="hamburger-text">メニュー</span></div>
    </header>

    <nav class="menu" id="menu">
        <ul>
            <li><a href="index.html">トップページへ戻る</a></li>
            <li><a href="profile.html">プロフィール</a></li>
            <li><a href="voice.html">ボイスサンプル</a></li>
            <li><a href="schedule.html">今後の出演予定</a></li>
            <li><a href="works.html">出演作</a></li>
            <li><a href="request.html">お仕事依頼</a></li>
            <li><a href="contact.html">お問い合わせフォーム</a></li>
        </ul>
    </nav>

    <main>
        <div class="content-container">
            
            <!-- ▼ 入力画面 ▼ -->
            <div id="inputScreen">
                <h2>予約</h2>
                <form id="reserveForm" action="" method="POST" onsubmit="event.preventDefault(); sendForm();">
                    
                    <!-- 1. 予約者氏名（カナ） -->
                    <div class="form-group">
                        <div class="form-label">
                            <label for="name">予約者氏名（カナ）</label>
                        </div>
                        <div class="form-input">
                            <input type="text" id="name" name="name" required placeholder="例: ヤマダ タロウ" class="required-input">
                        </div>
                    </div>
                    
                    <!-- 2. 人数 -->
                    <div class="form-group">
                        <div class="form-label">
                            <label for="people">人数</label>
                        </div>
                        <div class="form-input">
                            <input type="number" id="people" name="people" min="1" required placeholder="例: 1" class="required-input">
                            <div class="note">※半角数字でご入力ください</div>
                        </div>
                    </div>

                    <!-- 3. メールアドレス -->
                    <div class="form-group">
                        <div class="form-label">
                            <label for="email">メールアドレス</label>
                        </div>
                        <div class="form-input">
                            <input type="email" id="email" name="email" required placeholder="例: sample@example.com" class="required-input">
                            <div class="note">※ご入力いただいたメールアドレス宛に予約完了メールをお送りいたします</div>
                        </div>
                    </div>

                    <!-- 4. 日時 -->
                    <div class="form-group">
                        <div class="form-label">
                            <label for="datetime">日時</label>
                        </div>
                        <div class="form-input">
                            <select id="datetime" name="datetime" required class="required-input">
                                <option value="">日時を選択してください</option>
                                <option value="11/13(金) 20:00">11/13(金) 20:00</option>
                                <option value="11/14(土) 14:00">11/14(土) 14:00</option>
                                <option value="11/14(土) 17:00">11/14(土) 17:00</option>
                                <option value="11/14(土) 20:00">11/14(土) 20:00</option>
                                <option value="11/15(日) 12:00">11/15(日) 12:00</option>
                                <option value="11/15(日) 15:00">11/15(日) 15:00</option>
                            </select>
                            <div class="note">※「今後の出演予定（schedule.html）」のタイムテーブルから日時を選択してください</div>
                        </div>
                    </div>

                    <!-- 5. 内容確認ボタン -->
                    <div class="form-submit">
                        <button type="button" id="confirmButton" onclick="showConfirmScreen()" disabled>内容確認</button>
                    </div>

            </div>
            <!-- ▲ 入力画面ここまで ▲ -->

            <!-- ▼ 確認画面 ▼ -->
            <div id="confirmScreen">
                <h2>入力内容のご確認</h2>
                <p style="margin-bottom: 30px; color: #555;">以下の内容で予約を送信します。よろしければ「送信」ボタンを押してください。</p>
                
                <div id="confirmContent">
                    <!-- ここにJavaScriptで確認内容が挿入されます -->
                </div>

                <div class="form-submit">
                    <button type="button" onclick="backToInput()" style="background-color: #666;">前に戻る</button>
                    <button type="button" id="submitButton" onclick="sendForm()">送信</button>
                </div>
            </div>
            <!-- ▲ 確認画面ここまで ▲ -->
            
            <!-- ▼ 予約完了画面 ▼ -->
            <div id="completeScreen">
                <h2>予約完了</h2>
                <p>予約が完了しました</p>
                <div class="form-submit">
                    <button type="button" onclick="location.href='index.html'" style="background-color: #666;">トップページへ戻る</button>
                </div>
            </div>
            <!-- ▲ 予約完了画面ここまで ▲ -->
            
                </form>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const menu = document.getElementById('menu');

            setTimeout(() => {
                hamburger.classList.add('show');
            }, 1500);

            // ハンバーガーボタンをクリックした時の処理（開閉）
            hamburger.addEventListener('click', () => {
                menu.classList.toggle('open');
            });

            // 画面のどこかをクリックした時にメニューを閉じる処理
            document.addEventListener('click', (event) => {
                if (menu.classList.contains('open') && !menu.contains(event.target) && !hamburger.contains(event.target)) {
                    menu.classList.remove('open');
                }
            });

            // schedule.html からタイムテーブルを読み込む
            // loadTimetableFromSchedule(); // 日時を固定選択式に変更したためコメントアウト

            // 必須入力チェックのイベントリスナー設定
            const inputs = document.querySelectorAll('.required-input');
            inputs.forEach(input => {
                input.addEventListener('input', checkFormValidity);
                if (input.tagName === 'SELECT') {
                    input.addEventListener('change', checkFormValidity);
                }
            });
        });

        // schedule.html の『タイムテーブル』を参照してプルダウンを生成する処理
        async function loadTimetableFromSchedule() {
            const select = document.getElementById('datetime');
            try {
                const response = await fetch('schedule.html');
                if (!response.ok) throw new Error('schedule.html の読み込みに失敗しました');
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                let timetableItems = [];

                // パターン1: id="timetable" または class="timetable" が指定されている場合
                const timetableEl = doc.querySelector('#timetable, .timetable');
                if (timetableEl) {
                    const listItems = timetableEl.querySelectorAll('li, option');
                    if (listItems.length > 0) {
                        listItems.forEach(li => {
                            const text = li.textContent.trim();
                            if (text) timetableItems.push(text);
                        });
                    } else {
                        const lines = timetableEl.innerHTML.split(/<br\s*\/?>|\n/i);
                        lines.forEach(line => {
                            const cleanText = line.replace(/<[^>]*>/g, '').trim();
                            if (cleanText && !cleanText.includes('タイムテーブル') && !cleanText.startsWith('※')) {
                                timetableItems.push(cleanText);
                            }
                        });
                    }
                }

                // パターン2: 概要欄（.schedule-overview）内のテキストから「【タイムテーブル】」や「タイムテーブル」を探す場合
                if (timetableItems.length === 0) {
                    const paragraphs = doc.querySelectorAll('.schedule-overview p, .schedule-overview div, .schedule-overview li');
                    paragraphs.forEach(p => {
                        if (p.textContent.includes('タイムテーブル')) {
                            const lines = p.innerHTML.split(/<br\s*\/?>|\n/i);
                            let inTimetableSection = false;
                            lines.forEach(line => {
                                const cleanText = line.replace(/<[^>]*>/g, '').trim();
                                if (cleanText.includes('タイムテーブル')) {
                                    inTimetableSection = true;
                                    return;
                                }
                                if (inTimetableSection) {
                                    // 別の【〇〇】の見出しが来たら終了
                                    if (/^【.*】$/.test(cleanText)) {
                                        inTimetableSection = false;
                                        return;
                                    }
                                    if (cleanText && !cleanText.startsWith('※') && !cleanText.startsWith('ご予約')) {
                                        timetableItems.push(cleanText);
                                    }
                                }
                            });
                        }
                    });
                }

                // 抽出したタイムテーブルをプルダウンに追加
                if (timetableItems.length > 0) {
                    timetableItems.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item;
                        option.textContent = item;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('タイムテーブルの取得エラー:', error);
            }
        }

        // フォームの入力状態をチェックして「内容確認」ボタンを制御する処理
        function checkFormValidity() {
            const inputs = document.querySelectorAll('.required-input');
            const confirmButton = document.getElementById('confirmButton');
            let allFilled = true;

            inputs.forEach(input => {
                if (input.value.trim() === '') {
                    allFilled = false;
                }
            });

            confirmButton.disabled = !allFilled;
        }

        // 確認画面を表示する処理
        function showConfirmScreen() {
            const name = document.getElementById('name').value;
            const people = document.getElementById('people').value;
            const email = document.getElementById('email').value;
            const datetime = document.getElementById('datetime').value;

            const confirmHtml = `
                <div class="confirm-item"><div class="confirm-label">予約者氏名（カナ）</div><div class="confirm-value">${name}</div></div>
                <div class="confirm-item"><div class="confirm-label">人数</div><div class="confirm-value">${people}名</div></div>
                <div class="confirm-item"><div class="confirm-label">メールアドレス</div><div class="confirm-value">${email}</div></div>
                <div class="confirm-item"><div class="confirm-label">日時</div><div class="confirm-value">${datetime}</div></div>
            `;

            document.getElementById('confirmContent').innerHTML = confirmHtml;
            document.getElementById('inputScreen').style.display = 'none';
            document.getElementById('confirmScreen').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // 入力画面に戻る処理
        function backToInput() {
            document.getElementById('confirmScreen').style.display = 'none';
            document.getElementById('inputScreen').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Google Apps Script (GAS) を用いた送信処理
        async function sendForm() {
            const submitButton = document.getElementById('submitButton');
            
            // ★重要：GASのウェブアプリURLを設定してください（既存のcontact.htmlと同じURL、または予約用GASのURL）★
            const gasUrl = 'https://script.google.com/macros/s/AKfycbzv1QXj0hfpqj2ih65iZtFBp7bjnP3IaVKBUduMjr40whvDVw1u09Jo5tq4QJ9_nc5t/exec';
            
            if (gasUrl === 'YOUR_GAS_WEB_APP_URL_HERE') {
                alert('送信先のURL（GASのURL）が設定されていません。');
                return;
            }

            // 二重送信防止
            submitButton.disabled = true;
            submitButton.textContent = '送信中...';

            const nameVal = document.getElementById('name').value;
            const peopleVal = document.getElementById('people').value;
            const emailVal = document.getElementById('email').value;
            const datetimeVal = document.getElementById('datetime').value;

            const postData = {
                formType: 'reserve',
                name: nameVal,
                people: peopleVal,
                email: emailVal,
                datetime: datetimeVal,
                sendTo: 'taikichikkura4@gmail.com',
                mailSubject: '予約問い合わせ',
                mailBody: `【予約内容】\n予約者氏名（カナ）: ${nameVal}\n人数: ${peopleVal}名\nメールアドレス: ${emailVal}\n日時: ${datetimeVal}`
            };

            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(postData)
                });

                // 送信成功時：予約完了画面へ切り替え
                document.getElementById('confirmScreen').style.display = 'none';
                document.getElementById('completeScreen').style.display = 'block';
                window.scrollTo(0, 0);
                
            } catch (error) {
                console.error('Error:', error);
                alert('通信エラーが発生しました。ネットワーク環境をご確認ください。');
                submitButton.disabled = false;
                submitButton.textContent = '送信';
            }
        }
    </script>

</body>
</html>
