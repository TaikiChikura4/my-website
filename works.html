<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出演作 | 地藏 大起 公式HP</title>
    <style>
        /* --- 基本設定（共通） --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #e5e5e5;
            overflow: auto; 
        }

        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- ヘッダー関連 --- */
        header {
            position: fixed; /* absolute から fixed に変更（スクロールしても上部に固定） */
            top: 0; /* 画面の一番上に配置 */
            left: 0; /* 画面の左端から配置 */
            width: 100%; /* 画面の横幅いっぱいに広げる */
            background-color: #e5e5e5; /* 変更：メインの場所と同じグレーの色にする */
            padding: 15px 30px; /* 元の配置に見た目を近づけるための余白（上下15px、左右30px） */
            box-sizing: border-box; /* 横幅が画面からはみ出さないための設定 */
            z-index: 100;
        }

        .title {
            margin: 0;
            font-size: 24px;
            color: #333;
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
        }

        .hamburger {
            font-size: 32px;
            color: #333;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex; 
            align-items: center;  
            gap: 8px;             
            opacity: 0;
            transition: opacity 0.8s ease;
            user-select: none;
        }

        .hamburger.show {
            opacity: 1;
        }

        .hamburger-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* --- ナビゲーションメニュー --- */
        .menu {
            position: absolute;
            top: 100px;
            left: 30px;
            background-color: #ffffff; /* ← 透過なしの完全な白（#ffffff）に変更しました */
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 999; /* ←変更：90から999にして最も手前に表示されるようにしました */
        }

        .menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu ul li {
            margin-bottom: 15px;
        }

        .menu ul li:last-child {
            margin-bottom: 0;
        }

        .menu ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.2s;
        }

        .menu ul li a:hover {
            color: #007BFF;
        }

        /* --- コンテンツ用のスタイル --- */
        .content-container {
            max-width: 800px;
            width: 85%;
            margin: 150px auto 50px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
        }

        .content-container h2 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #333;
            margin-bottom: 30px;
        }

        /* --- ▼ 出演作特有のスタイル ▼ --- */
        .works-category {
            margin-bottom: 40px;
        }

        .works-category h3 {
            font-size: 20px;
            color: #333;
            border-left: 5px solid #555; 
            padding-left: 12px;
            margin-bottom: 15px;
        }

        .works-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .works-list li {
            font-size: 16px;
            color: #333;
            /* ▼ 変更：ここの数値を大きくして、項目ごとの行間（1行分）をあけました ▼ */
            margin-bottom: 25px; 
            padding-left: 1.2em;
            text-indent: -1.2em;
            line-height: 1.6;
        }

        .works-list li::before {
            content: "・";
            color: #666;
        }

        .role {
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">地藏 大起（チクラ タイキ）MyWebsites</h1>
        <div class="hamburger" id="hamburger">≡<span class="hamburger-text">メニュー</span></div>
    </header>

    <nav class="menu" id="menu">
        <ul>
            <li><a href="index.html">トップページへ戻る</a></li>
            <li><a href="profile.html">プロフィール</a></li>
            <li><a href="voice.html">ボイスサンプル</a></li>
            <li><a href="works.html">出演作</a></li>
            <!-- ▼ メニューにお仕事依頼を追加 ▼ -->
            <li><a href="request.html">お仕事依頼</a></li>
        </ul>
    </nav>

    <main>
        <div class="content-container">
            <h2>出演作</h2>
            
            <!-- ▼ 修正箇所：舞台・朗読劇のリストを整理しました ▼ -->
            <div class="works-category">
                <h3>舞台・朗読劇</h3>
                <ul class="works-list">
                    <li>
                        朗読劇『花影朗読夜』<br>
                         『段梯子の恐怖』- <span class="role">友人F 役</span><br>
                         『殺人の涯』- <span class="role">男 役</span><br>
                         『卒塔婆小町』- <span class="role">詩人 他多数 役</span><br>
                    </li>
                    <li>
                        劇団ムーンライト朗読劇、舞台<br>
                         『時計のない村』- <span class="role">金持ち乙 役</span><br>
                         『夏の葬列』- <span class="role">男 役</span><br>
                         『私の街の空気』- <span class="role">タツヤ 役</span><br>
                         『TWINCLE×3』- <span class="role">西野 役</span>
                    </li>
                </ul>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const menu = document.getElementById('menu');

            setTimeout(() => {
                hamburger.classList.add('show');
            }, 1500);

            // ハンバーガーボタンをクリックした時の処理（開閉）
            hamburger.addEventListener('click', () => {
                menu.classList.toggle('open');
            });

            // ▼ 追加：画面のどこかをクリックした時にメニューを閉じる処理 ▼
            document.addEventListener('click', (event) => {
                // メニューが開いている状態で、クリックした場所が「メニュー本体」でも「ハンバーガーボタン」でもない場合に閉じる
                if (menu.classList.contains('open') && !menu.contains(event.target) && !hamburger.contains(event.target)) {
                    menu.classList.remove('open');
                }
            });
            // ▲ 追加ここまで ▲
        });
    </script>

</body>
</html>
