<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地藏 大起 公式HP</title>
    <style>
        /* --- 基本設定 --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #e5e5e5;
            overflow: hidden; 
        }

        /* --- アニメーションの定義 --- */
        @keyframes fadeDown {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- ヘッダー関連 --- */
        header {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .title {
            margin: 0;
            font-size: 24px;
            color: #333;
            opacity: 0; 
            animation: fadeDown 1.5s ease forwards;
        }

        .hamburger {
            font-size: 32px;
            color: #333;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex; 
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.8s ease; 
            user-select: none;
        }

        .hamburger.show {
            opacity: 1;
        }

        .hamburger-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* --- ナビゲーションメニュー --- */
        .menu {
            position: absolute;
            top: 100px;
            left: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 90;
        }

        .menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu ul li {
            margin-bottom: 15px;
        }

        .menu ul li:last-child {
            margin-bottom: 0;
        }

        .menu ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.2s;
        }

        .menu ul li a:hover {
            color: #007BFF;
        }

/* --- ▼ 追加：座右の銘のデザインと配置 ▼ --- */
        .mottos {
            position: absolute;
            top: 260px; /* メニューの下（開いても被らない位置）に配置 */
            left: 30px;
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 40px; /* それぞれ少し幅（間隔）を持たせる */
            
            /* ▼ 変更：中央の写真のギリギリまで横幅を広げる ▼ */
            max-width: calc(38vw - 30px); 
            /* ▲ 変更ここまで ▲ */
            
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
            animation-delay: 0.6s;
        }

        /* 1つ目：優しいけど威厳があるフォント（明朝体） */
        .motto1 {
            font-family: "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", "游明朝", "Yu Mincho", serif;
            /* ▼ 変更：PC画面でより大きくなるよう推奨値と最大値を変更 ▼ */
            font-size: clamp(12px, 2.5vw, 40px); 
            /* ▲ 変更ここまで ▲ */
            color: #333;
            line-height: 1.4;
        }

        /* 2つ目：書道で書くような力強いフォント（行書体・太字明朝） */
        .motto2 {
            font-family: "HG行書体", "HGS行書体", "游明朝", "Yu Mincho", serif;
            font-weight: bold;
            /* ▼ 変更：PC画面でより大きくなるよう推奨値と最大値を変更 ▼ */
            font-size: clamp(14px, 3vw, 50px);
            /* ▲ 変更ここまで ▲ */
            color: #111;
        }

        /* 3つ目：壮大なフォント（極太ゴシックで文字間隔を広げる） */
        .motto3 {
            font-family: "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "游ゴシック", "Yu Gothic", sans-serif;
            font-weight: 900;
            /* ▼ 変更：PC画面でより大きくなるよう推奨値と最大値を変更 ▼ */
            font-size: clamp(13px, 2.8vw, 45px);
            /* ▲ 変更ここまで ▲ */
            letter-spacing: 2px;
            color: #222;
        }
        /* --- ▲ 追加ここまで ▲ --- */

        /* --- メインコンテンツ --- */
        main {
            height: 100%;
            display: flex;
            justify-content: center; 
            align-items: center;     
        }

        /* ▼ 変更：写真をど真ん中に固定するための設定 ▼ */
        .main-content-wrapper {
            position: relative; /* SNSボタンを浮かせて配置するための基準点 */
            display: flex;
        }

        .main-image {
            max-width: 70vw; /* 写真が大きすぎて右のボタンが見切れないように調整 */
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15); 
            opacity: 0; 
            animation: fadeDown 1.5s ease forwards;
        }

        /* --- ▼ SNSリンクのスタイル ▼ --- */
        .social-links {
            /* 写真の右側にボタンを浮かせる設定 */
            position: absolute;
            top: 50%; /* 縦の中央 */
            left: 100%; /* 写真の右端に配置 */
            transform: translateY(-50%); /* 縦方向のズレを補正してぴったり真ん中へ */
            margin-left: 30px; /* 写真とボタンの隙間 */
            
            display: flex;
            flex-direction: column; /* 縦並びにする */
            gap: 20px;
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
            animation-delay: 0.3s; /* 画像よりほんの少し遅れてフワッと出します */
        }

        .social-links a {
            text-decoration: none;
            color: #333;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 30px; /* 角を丸くしてボタンっぽく */
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            white-space: nowrap; /* ボタンの文字が途中で改行されないようにする */
        }

        /* マウスを乗せたときのアニメーション */
        .social-links a:hover {
            background-color: #333;
            color: #fff;
            transform: translateY(-3px); /* 少し上に浮く */
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        /* --- ▼ スマホなど画面が狭い時の調整 ▼ --- */
        @media (max-width: 768px) {
            .main-content-wrapper {
                flex-direction: column; /* 縦並びに変更 */
                align-items: center;
                gap: 20px;
            }
            .main-image {
                max-width: 85vw;
                max-height: 70vh;
            }
            .social-links {
                position: static; /* 浮かせる設定を解除して通常配置に戻す */
                transform: none;
                margin-left: 0;
                flex-direction: row; /* スマホではボタンを横並びに */
            }
            
            /* ▼ 追加：座右の銘のスマホ対応（写真に被らないよう画面下部に横並び配置） ▼ */
            .mottos {
                top: auto;
                bottom: 20px;
                left: 0;
                width: 100%;
                max-width: 100%;
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap; /* 画面からはみ出る場合は折り返す */
                gap: 15px;
                padding: 0 10px;
                box-sizing: border-box;
            }
            .motto1 { font-size: 12px; }
            .motto2 { font-size: 14px; }
            .motto3 { font-size: 13px; }
            /* ▲ 追加ここまで ▲ */
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">地藏 大起（チクラ タイキ）MyWebsites</h1>
        <div class="hamburger" id="hamburger">≡<span class="hamburger-text">メニュー</span></div>
    </header>

    <nav class="menu" id="menu">
        <ul>
            <li><a href="profile.html">プロフィール</a></li>
            <li><a href="voice.html">ボイスサンプル</a></li>
            <li><a href="works.html">出演作</a></li>
        </ul>
    </nav>

    <!-- ▼ 追加：座右の銘 ▼ -->
    <div class="mottos">
        <div class="motto motto1">信じればいつか夢は叶う</div>
        <div class="motto motto2">俺自身に勝つ！</div>
        <div class="motto motto3">欲望は進化のエネルギー</div>
    </div>
    <!-- ▲ 追加ここまで ▲ -->

    <main>
        <div class="main-content-wrapper">
            <img src="IMG_0479_2.jpg" alt="メイン画像" class="main-image">
            
            <div class="social-links">
                <a href="https://x.com/Taiki_Chikura88" target="_blank" rel="noopener">𝕏</a>
                <a href="https://www.instagram.com/8taiki.333?igsh=Z3Z6NzhqY2tta3dx" target="_blank" rel="noopener">Instagram</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const menu = document.getElementById('menu');

            setTimeout(() => {
                hamburger.classList.add('show');
            }, 1500);

            hamburger.addEventListener('click', () => {
                menu.classList.toggle('open');
            });
        });
    </script>

</body>
</html>
