<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地藏 大起 公式HP</title>
    <style>
        /* --- 基本設定 --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #e5e5e5;
            overflow: auto; /* ←変更：hiddenからautoにしてスクロール可能にしました */
            position: relative; /* ←追加：スマホ版でSNSボタンなどをページ下部に固定する基準にします */
        }

        /* --- アニメーションの定義 --- */
        @keyframes fadeDown {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- ヘッダー関連 --- */
        header {
            position: fixed; /* absolute から fixed に変更（スクロールしても上部に固定） */
            top: 0; /* 画面の一番上に配置 */
            left: 0; /* 画面の左端から配置 */
            width: 100%; /* 画面の横幅いっぱいに広げる */
            background-color: #e5e5e5; /* 変更：メインの場所と同じグレーの色にする */
            padding: 15px 30px; /* 元の配置に見た目を近づけるための余白（上下15px、左右30px） */
            box-sizing: border-box; /* 横幅が画面からはみ出さないための設定 */
            z-index: 100;
        }

        .title {
            margin: 0;
            font-size: 24px;
            color: #333;
            opacity: 0; 
            animation: fadeDown 1.5s ease forwards;
        }

        .hamburger {
            font-size: 32px;
            color: #333;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex; 
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.8s ease; 
            user-select: none;
        }

        .hamburger.show {
            opacity: 1;
        }

        .hamburger-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* --- ナビゲーションメニュー --- */
        .menu {
            position: absolute;
            top: 100px;
            left: 30px;
            background-color: #ffffff; /* ← 透過なしの完全な白（#ffffff）に変更しました */
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 999; /* ←変更：90から999にして最も手前に表示されるようにしました */
        }

        .menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu ul li {
            margin-bottom: 15px;
        }

        .menu ul li:last-child {
            margin-bottom: 0;
        }

        .menu ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.2s;
        }

        .menu ul li a:hover {
            color: #007BFF;
        }

/* --- ▼ 追加：座右の銘のデザインと配置 ▼ --- */
        .mottos {
            position: absolute;
            top: 260px; /* メニューの下（開いても被らない位置）に配置 */
            left: 30px;
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 40px; /* それぞれ少し幅（間隔）を持たせる */
            
            /* ▼ 変更：中央の写真のギリギリまで横幅を広げる ▼ */
            max-width: calc(38vw - 30px); 
            /* ▲ 変更ここまで ▲ */
            
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
            animation-delay: 0.6s;
        }

        /* 1つ目：優しいけど威厳があるフォント（明朝体） */
        .motto1 {
            font-family: "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", "游明朝", "Yu Mincho", serif;
            /* ▼ 変更：PC画面でより大きくなるよう推奨値と最大値を変更 ▼ */
            font-size: clamp(12px, 2.5vw, 40px); 
            /* ▲ 変更ここまで ▲ */
            color: #333;
            line-height: 1.4;
        }

        /* 2つ目：書道で書くような力強いフォント（行書体・太字明朝） */
        .motto2 {
            font-family: "HG行書体", "HGS行書体", "游明朝", "Yu Mincho", serif;
            font-weight: bold;
            /* ▼ 変更：PC画面でより大きくなるよう推奨値と最大値を変更 ▼ */
            font-size: clamp(14px, 3vw, 50px);
            /* ▲ 変更ここまで ▲ */
            color: #111;
        }

        /* 3つ目：壮大なフォント（極太ゴシックで文字間隔を広げる） */
        .motto3 {
            font-family: "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "游ゴシック", "Yu Gothic", sans-serif;
            font-weight: 900;
            /* ▼ 変更：PC画面でより大きくなるよう推奨値と最大値を変更 ▼ */
            font-size: clamp(13px, 2.8vw, 45px);
            /* ▲ 変更ここまで ▲ */
            letter-spacing: 2px;
            color: #222;
        }
        /* --- ▲ 追加ここまで ▲ --- */

        /* --- メインコンテンツ --- */
        main {
            min-height: 100vh; /* ←変更：heightからmin-heightに変更し、枠が伸びるようにしました */
            display: flex;
            justify-content: center; 
            align-items: center;     
        }

        /* ▼ 変更：写真をど真ん中に固定するための設定 ▼ */
        .main-content-wrapper {
            position: relative; /* SNSボタンを浮かせて配置するための基準点 */
            display: flex;
        }

        .main-image {
            max-width: 70vw; /* 写真が大きすぎて右のボタンが見切れないように調整 */
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15); 
            opacity: 0; 
            animation: fadeDown 1.5s ease forwards;
        }

        /* --- ▼ SNSリンクのスタイル ▼ --- */
        .social-links {
            /* 写真の右側にボタンを浮かせる設定 */
            position: absolute;
            top: 50%; /* 縦の中央 */
            left: 100%; /* 写真の右端に配置 */
            transform: translateY(-50%); /* 縦方向のズレを補正してぴったり真ん中へ */
            margin-left: 30px; /* 写真とボタンの隙間 */
            
            display: flex;
            flex-direction: column; /* 縦並びにする */
            gap: 20px;
            opacity: 0;
            animation: fadeDown 1.5s ease forwards;
            animation-delay: 0.3s; /* 画像よりほんの少し遅れてフワッと出します */
        }

        .social-links a {
            text-decoration: none;
            color: #333;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 30px; /* 角を丸くしてボタンっぽく */
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            white-space: nowrap; /* ボタンの文字が途中で改行されないようにする */
        }

        /* マウスを乗せたときのアニメーション */
        .social-links a:hover {
            background-color: #333;
            color: #fff;
            transform: translateY(-3px); /* 少し上に浮く */
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        /* --- ▼ スマホなど画面が狭い時の調整 ▼ --- */
        @media (max-width: 768px) {
            /* スクロールに合わせてページが下まで自然に伸びるようにする */
            body, html {
                height: auto;
                min-height: 100vh;
            }
            
            /* ページ全体を上から順に並べ替えられる設定（フレックスボックス）にする */
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            
            /* mainとwrapperの枠組みを透明化し、中身（画像やSNS）を直接並べ替えに参加させる */
            main, .main-content-wrapper {
                display: contents; 
            }

            /* ① 1番目：プロフィール画像 */
            .main-image {
                order: 1; /* 1番目に表示 */
                margin-top: 120px; /* ヘッダーを避けるための上の余白 */
                margin-bottom: 40px; /* 下（座右の銘）とのすき間 */
                max-width: 85vw;
                height: auto; /* 縦横比を綺麗に保つ */
                max-height: none; /* PC版の高さ制限を解除 */
            }

            /* ② 2番目：座右の銘 */
            .mottos {
                order: 2; /* 2番目に表示 */
                position: static; /* 重なり（絶対配置）を完全に解除し、自然な流れに配置 */
                width: 100%;
                max-width: 100%;
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap; 
                gap: 15px;
                padding: 0 10px;
                box-sizing: border-box;
                margin-bottom: 40px; /* 下（SNSボタン）とのすき間 */
            }

            /* ③ 3番目：SNSボタン（𝕏とInstagram） */
            .social-links {
                order: 3; /* 3番目に表示 */
                position: static; /* 重なり（絶対配置）を完全に解除し、自然な流れに配置 */
                width: 100%;
                flex-direction: row; /* 横並びに */
                justify-content: center; /* 中央寄せ */
                transform: none; /* PC用のズレ補正をリセット */
                margin-left: 0;
                margin-bottom: 50px; /* 画面の一番下の余白 */
            }

            /* スマホ用のフォントサイズ微調整 */
            .motto1 { font-size: 13px; }
            .motto2 { font-size: 15px; }
            .motto3 { font-size: 14px; }

            /* ▼ 追加：スマホ版では改行を無効にする ▼ */
            .pc-br {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">地藏 大起（チクラ タイキ）株式会社シーグリーン所属</h1>
        <div class="hamburger" id="hamburger">≡<span class="hamburger-text">メニュー</span></div>
    </header>

    <nav class="menu" id="menu">
        <ul>
            <li><a href="profile.html">プロフィール</a></li>
            <li><a href="voice.html">ボイスサンプル</a></li>
            <li><a href="works.html">出演作</a></li>
            <li><a href="request.html">お仕事依頼</a></li>
            <li><a href="contact.html">お問い合わせフォーム</a></li> <!-- 追加箇所 -->
        </ul>
    </nav>

    <!-- ▼ 追加：座右の銘 ▼ -->
    <div class="mottos">
        <div class="motto motto1">信じればいつか夢は叶う</div>
        <div class="motto motto2">真の集中力とは<br class="pc-br">怒りと平静心の間</div>
        <div class="motto motto3">欲望は進化のエネルギー</div>
    </div>
    <!-- ▲ 追加ここまで ▲ -->

    <main>
        <div class="main-content-wrapper">
            <img src="IMG_0479_2.jpg" alt="メイン画像" class="main-image">
            
            <div class="social-links">
                <a href="https://x.com/Taiki_Chikura88" target="_blank" rel="noopener">𝕏</a>
                <a href="https://www.instagram.com/8taiki.333?igsh=Z3Z6NzhqY2tta3dx" target="_blank" rel="noopener">Instagram</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const menu = document.getElementById('menu');

            setTimeout(() => {
                hamburger.classList.add('show');
            }, 1500);

            // ハンバーガーボタンをクリックした時の処理（開閉）
            hamburger.addEventListener('click', () => {
                menu.classList.toggle('open');
            });

            // ▼ 追加：画面のどこかをクリックした時にメニューを閉じる処理 ▼
            document.addEventListener('click', (event) => {
                // メニューが開いている状態で、クリックした場所が「メニュー本体」でも「ハンバーガーボタン」でもない場合に閉じる
                if (menu.classList.contains('open') && !menu.contains(event.target) && !hamburger.contains(event.target)) {
                    menu.classList.remove('open');
                }
            });
            // ▲ 追加ここまで ▲
        });
    </script>

</body>
</html>
